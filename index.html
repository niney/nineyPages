<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음식 메뉴 룰렛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #2d3748;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #2d3748;
            animation: fadeInDown 1s ease-in-out;
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #4a5568;
        }

        .category-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .category-btn {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .category-btn:hover {
            background: #edf2f7;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .category-btn.active {
            background: #4299e1;
            color: white;
            border-color: #4299e1;
            box-shadow: 0 2px 12px rgba(66, 153, 225, 0.3);
        }

        .roulette-container {
            position: relative;
            display: inline-block;
            margin: 30px 0;
        }

        .roulette-wheel {
            position: relative;
        }

        #rouletteCanvas {
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            background: white;
        }

        .roulette-arrow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #e53e3e;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
            z-index: 10;
        }

        .spin-button {
            background: #48bb78;
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(72, 187, 120, 0.3);
            margin-top: 20px;
        }

        .spin-button:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-container {
            margin-top: 30px;
            padding: 25px;
            background: #f7fafc;
            border-radius: 15px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            border: 1px solid #e2e8f0;
        }

        .result-text {
            font-size: 2em;
            font-weight: bold;
            color: #2d3748;
            animation: bounceIn 0.6s ease-out;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #4299e1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-text {
            color: #e53e3e;
            font-size: 0.9em;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            opacity: 0.08;
            font-size: 3em;
            animation: float 15s infinite ease-in-out;
        }

        .shape:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            left: 50%;
            animation-delay: 4s;
        }

        .shape:nth-child(4) {
            left: 70%;
            animation-delay: 6s;
        }

        .shape:nth-child(5) {
            left: 85%;
            animation-delay: 8s;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.08;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #718096;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            .container {
                padding: 20px;
            }
            #rouletteCanvas {
                width: 280px !important;
                height: 280px !important;
            }
            .result-text {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape">🍚</div>
        <div class="shape">🍜</div>
        <div class="shape">🍝</div>
        <div class="shape">🍕</div>
        <div class="shape">🍱</div>
    </div>

    <div class="container">
        <h1>🎰 음식 메뉴 룰렛</h1>
        <p class="subtitle">카테고리를 선택하고 룰렛을 돌려보세요!</p>

        <div class="category-buttons">
            <button class="category-btn active" onclick="selectCategory('korean')">🍚 한식</button>
            <button class="category-btn" onclick="selectCategory('chinese')">🍜 중식</button>
            <button class="category-btn" onclick="selectCategory('western')">🍝 양식</button>
        </div>

        <div class="roulette-container">
            <div class="roulette-arrow"></div>
            <div class="roulette-wheel">
                <canvas id="rouletteCanvas" width="400" height="400"></canvas>
            </div>
        </div>

        <button class="spin-button" onclick="spinRoulette()" id="spinBtn">🎯 룰렛 돌리기</button>

        <div class="result-container">
            <div id="result">
                <p style="color: #718096;">룰렛을 돌려서 오늘의 메뉴를 선택해보세요!</p>
            </div>
        </div>

        <div class="footer">
            <p>맛있는 식사 되세요! 🍽️</p>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://nlpfriendly.easypcb.co.kr';

        const categoryMap = {
            'korean': '한식',
            'chinese': '중식',
            'western': '양식'
        };

        const colorPalettes = {
            korean: ['#e53e3e', '#dd6b20', '#d69e2e', '#38a169', '#319795', '#3182ce', '#5a67d8', '#805ad5'],
            chinese: ['#c53030', '#2c5282', '#2f855a', '#6b46c1', '#00718a', '#c05621', '#276749', '#4a5568'],
            western: ['#742a2a', '#1a365d', '#22543d', '#553c9a', '#744210', '#2d3748', '#2c7a7b', '#975a16']
        };

        let currentCategory = 'korean';
        let currentMenuData = { items: [], colors: [] };
        let isSpinning = false;
        let isLoading = false;
        let currentRotation = 0;

        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');

        // API 함수들
        async function fetchRestaurants(category) {
            const response = await fetch(`${API_BASE_URL}/api/restaurants?limit=20&offset=0&category=${category}`);
            if (!response.ok) {
                throw new Error('레스토랑 목록을 불러오는데 실패했습니다');
            }
            return await response.json();
        }

        async function fetchRestaurantDetails(restaurantId) {
            const response = await fetch(`${API_BASE_URL}/api/restaurants/${restaurantId}`);
            if (!response.ok) {
                throw new Error('레스토랑 상세 정보를 불러오는데 실패했습니다');
            }
            return await response.json();
        }

        async function loadMenuData(category) {
            try {
                isLoading = true;
                showLoading();

                // 레스토랑 리스트 가져오기
                const restaurants = await fetchRestaurants(categoryMap[category]);

                if (!restaurants || restaurants.length === 0) {
                    throw new Error('해당 카테고리의 레스토랑이 없습니다');
                }

                // 각 레스토랑의 메뉴 가져오기
                const allMenus = [];
                const detailPromises = restaurants.slice(0, 10).map(r => fetchRestaurantDetails(r.id));
                const details = await Promise.all(detailPromises);

                details.forEach(detail => {
                    if (detail.result && detail.data && detail.data.menus) {
                        detail.data.menus.forEach(menu => {
                            allMenus.push({
                                name: menu.name,
                                price: menu.price,
                                restaurant: detail.data.restaurant.name
                            });
                        });
                    }
                });

                if (allMenus.length === 0) {
                    throw new Error('메뉴 정보가 없습니다');
                }

                // 메뉴가 너무 많으면 랜덤으로 선택
                const maxMenus = 12;
                let selectedMenus = allMenus;
                if (allMenus.length > maxMenus) {
                    selectedMenus = [];
                    const shuffled = [...allMenus].sort(() => Math.random() - 0.5);
                    selectedMenus = shuffled.slice(0, maxMenus);
                }

                // 색상 할당
                const colors = [];
                const palette = colorPalettes[category];
                for (let i = 0; i < selectedMenus.length; i++) {
                    colors.push(palette[i % palette.length]);
                }

                currentMenuData = {
                    items: selectedMenus,
                    colors: colors
                };

                hideLoading();
                drawRoulette();

            } catch (error) {
                console.error('Error loading menu data:', error);
                showError(error.message);

                // 폴백 데이터 사용
                useFallbackData(category);
            } finally {
                isLoading = false;
            }
        }

        function useFallbackData(category) {
            const fallbackData = {
                korean: ['김치찌개', '된장찌개', '불고기', '비빔밥', '삼겹살', '갈비탕', '냉면', '순두부찌개'],
                chinese: ['짜장면', '짬뽕', '탕수육', '마파두부', '양장피', '깐풍기', '볶음밥', '군만두'],
                western: ['스테이크', '파스타', '피자', '리조또', '햄버거', '샐러드', '그라탕', '오므라이스']
            };

            const items = fallbackData[category].map(name => ({ name, price: '', restaurant: '' }));
            currentMenuData = {
                items: items,
                colors: colorPalettes[category]
            };

            hideLoading();
            drawRoulette();
        }

        function showLoading() {
            document.getElementById('result').innerHTML = '<p style="color: #718096;"><span class="loading"></span>메뉴 데이터를 불러오는 중...</p>';
            document.getElementById('spinBtn').disabled = true;
        }

        function hideLoading() {
            document.getElementById('result').innerHTML = '<p style="color: #718096;">룰렛을 돌려서 오늘의 메뉴를 선택해보세요!</p>';
            document.getElementById('spinBtn').disabled = false;
        }

        function showError(message) {
            document.getElementById('result').innerHTML = `<p class="error-text">⚠️ ${message}<br><small>기본 메뉴로 진행합니다</small></p>`;
        }

        async function selectCategory(category) {
            if (isSpinning || isLoading) return;

            currentCategory = category;

            // 버튼 active 상태 변경
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // API에서 메뉴 데이터 로드
            await loadMenuData(category);
        }

        function drawRoulette() {
            if (!currentMenuData.items || currentMenuData.items.length === 0) {
                return;
            }

            const items = currentMenuData.items;
            const colors = currentMenuData.colors;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;
            const sliceAngle = (Math.PI * 2) / items.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 각 섹션 그리기
            items.forEach((item, index) => {
                const startAngle = sliceAngle * index + currentRotation;
                const endAngle = startAngle + sliceAngle;

                // 섹션 배경
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.lineTo(centerX, centerY);
                ctx.fillStyle = colors[index];
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 텍스트
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 4;
                const menuName = typeof item === 'string' ? item : item.name;
                ctx.fillText(menuName, radius - 20, 5);
                ctx.restore();
            });

            // 중앙 원
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function spinRoulette() {
            if (isSpinning || !currentMenuData.items || currentMenuData.items.length === 0) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('result').innerHTML = '<p style="color: #718096;">룰렛이 돌아가는 중...</p>';

            const items = currentMenuData.items;
            const spinDuration = 3000; // 3초
            const spinRotations = 5 + Math.random() * 3; // 5-8바퀴
            const totalRotation = spinRotations * Math.PI * 2;

            const startTime = Date.now();
            const startRotation = currentRotation;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);

                // easeOut 효과
                const easeProgress = 1 - Math.pow(1 - progress, 3);

                currentRotation = startRotation + totalRotation * easeProgress;
                drawRoulette();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // 결과 계산
                    const normalizedRotation = currentRotation % (Math.PI * 2);
                    const sliceAngle = (Math.PI * 2) / items.length;

                    // 화살표가 가리키는 위치 (위쪽 중앙)
                    const arrowAngle = (Math.PI * 2 - normalizedRotation + Math.PI / 2) % (Math.PI * 2);
                    const selectedIndex = Math.floor(arrowAngle / sliceAngle);
                    const selectedItem = items[selectedIndex];

                    // 결과 표시
                    setTimeout(() => {
                        const menuName = typeof selectedItem === 'string' ? selectedItem : selectedItem.name;
                        const restaurant = typeof selectedItem === 'object' && selectedItem.restaurant
                            ? `<br><small style="font-size: 0.6em; color: #718096;">${selectedItem.restaurant}</small>`
                            : '';
                        const price = typeof selectedItem === 'object' && selectedItem.price
                            ? `<br><small style="font-size: 0.5em; color: #4a5568;">${selectedItem.price}</small>`
                            : '';

                        document.getElementById('result').innerHTML =
                            `<div class="result-text">🎉 ${menuName} 🎉${restaurant}${price}</div>`;
                        isSpinning = false;
                        document.getElementById('spinBtn').disabled = false;
                    }, 500);
                }
            }

            animate();
        }

        // 초기 데이터 로드
        window.addEventListener('DOMContentLoaded', () => {
            loadMenuData('korean');
        });
    </script>
</body>
</html>
