<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음식 메뉴 룰렛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #2d3748;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #2d3748;
            animation: fadeInDown 1s ease-in-out;
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #4a5568;
        }

        .category-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .category-btn {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .category-btn:hover {
            background: #edf2f7;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .category-btn.active {
            background: #4299e1;
            color: white;
            border-color: #4299e1;
            box-shadow: 0 2px 12px rgba(66, 153, 225, 0.3);
        }

        .restaurant-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .restaurant-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .restaurant-btn {
            background: white;
            color: #2d3748;
            border: 2px solid #cbd5e0;
            padding: 10px 20px;
            font-size: 0.95em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .restaurant-btn:hover {
            background: #edf2f7;
            border-color: #4299e1;
            transform: translateY(-1px);
        }

        .restaurant-btn.selected {
            background: #48bb78;
            color: white;
            border-color: #48bb78;
            box-shadow: 0 2px 8px rgba(72, 187, 120, 0.3);
        }

        .roulette-container {
            position: relative;
            display: inline-block;
            margin: 30px 0;
        }

        .roulette-wheel {
            position: relative;
        }

        #rouletteCanvas {
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            background: white;
        }

        .roulette-arrow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #e53e3e;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
            z-index: 10;
        }

        .spin-button {
            background: #48bb78;
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(72, 187, 120, 0.3);
            margin-top: 20px;
        }

        .spin-button:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-container {
            margin-top: 30px;
            padding: 25px;
            background: #f7fafc;
            border-radius: 15px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            border: 1px solid #e2e8f0;
        }

        .result-text {
            font-size: 2em;
            font-weight: bold;
            color: #2d3748;
            animation: bounceIn 0.6s ease-out;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #4299e1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-text {
            color: #e53e3e;
            font-size: 0.9em;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            opacity: 0.08;
            font-size: 3em;
            animation: float 15s infinite ease-in-out;
        }

        .shape:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            left: 50%;
            animation-delay: 4s;
        }

        .shape:nth-child(4) {
            left: 70%;
            animation-delay: 6s;
        }

        .shape:nth-child(5) {
            left: 85%;
            animation-delay: 8s;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.08;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #718096;
        }

        .debug-log {
            margin-top: 20px;
            padding: 15px;
            background: #1a202c;
            color: #e2e8f0;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.75em;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #2d3748;
        }

        .debug-log h3 {
            color: #63b3ed;
            margin-bottom: 10px;
            font-size: 1.1em;
            text-align: center;
        }

        .debug-log pre {
            margin: 5px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .log-success {
            color: #68d391;
        }

        .log-error {
            color: #fc8181;
        }

        .log-warning {
            color: #f6ad55;
        }

        .log-info {
            color: #63b3ed;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            .container {
                padding: 20px;
            }
            #rouletteCanvas {
                width: 280px !important;
                height: 280px !important;
            }
            .result-text {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape">🍚</div>
        <div class="shape">🍜</div>
        <div class="shape">🍝</div>
        <div class="shape">🍕</div>
        <div class="shape">🍱</div>
    </div>

    <div class="container">
        <h1>🎰 음식 메뉴 룰렛</h1>
        <p class="subtitle">레스토랑을 선택하고 룰렛을 돌려보세요!</p>

        <div class="restaurant-section" id="restaurantSection">
            <label for="restaurantSelect" style="display: block; margin-bottom: 10px; font-weight: bold; color: #2d3748;">
                🏪 레스토랑 선택
            </label>
            <select id="restaurantSelect" onchange="selectRestaurant()" style="width: 100%; padding: 12px; font-size: 1em; border-radius: 8px; border: 2px solid #cbd5e0; background: white; color: #2d3748; cursor: pointer;">
                <option value="">레스토랑을 선택하세요...</option>
            </select>
        </div>

        <div class="roulette-container">
            <div class="roulette-arrow"></div>
            <div class="roulette-wheel">
                <canvas id="rouletteCanvas" width="400" height="400"></canvas>
            </div>
        </div>

        <button class="spin-button" onclick="spinRoulette()" id="spinBtn">🎯 룰렛 돌리기</button>

        <div class="result-container">
            <div id="result">
                <p style="color: #718096;">룰렛을 돌려서 오늘의 메뉴를 선택해보세요!</p>
            </div>
        </div>

        <div class="footer">
            <p>맛있는 식사 되세요! 🍽️</p>
        </div>

        <div class="debug-log" id="debugLog">
            <h3>🔍 디버그 로그</h3>
            <div id="logContent"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://nlpfriendly.easypcb.co.kr';

        const colorPalette = ['#e53e3e', '#dd6b20', '#d69e2e', '#38a169', '#319795', '#3182ce', '#5a67d8', '#805ad5', '#c53030', '#2c5282', '#2f855a', '#6b46c1'];

        let currentRestaurants = [];
        let selectedRestaurant = null;
        let currentMenuData = { items: [], colors: [] };
        let isSpinning = false;
        let isLoading = false;
        let currentRotation = 0;

        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');

        // 화면 로깅 함수
        function logToScreen(message, type = 'info') {
            const logContent = document.getElementById('logContent');
            const pre = document.createElement('pre');
            pre.className = `log-${type}`;
            pre.textContent = message;
            logContent.appendChild(pre);

            // 스크롤을 맨 아래로
            const debugLog = document.getElementById('debugLog');
            debugLog.scrollTop = debugLog.scrollHeight;

            // 콘솔에도 출력
            console.log(message);
        }

        function clearLog() {
            document.getElementById('logContent').innerHTML = '';
        }

        // API 함수들
        async function fetchRestaurants() {
            try {
                const url = `${API_BASE_URL}/api/restaurants?limit=1000&offset=0`;
                logToScreen('🌐 [요청] 레스토랑 목록 가져오기', 'info');
                logToScreen(`📋 URL: ${url}`, 'info');
                logToScreen(`📋 최대 1000개 레스토랑 요청`, 'info');

                const response = await fetch(url);

                logToScreen(`📡 [응답] 상태: ${response.status} ${response.statusText}`, 'info');
                const corsHeader = response.headers.get('access-control-allow-origin');
                logToScreen(`📡 CORS 헤더: ${corsHeader || '없음'}`, corsHeader ? 'success' : 'warning');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: 레스토랑 목록을 불러오는데 실패했습니다`);
                }

                const data = await response.json();
                logToScreen('✅ [성공] 데이터 수신 완료', 'success');
                logToScreen(`📊 데이터 타입: ${typeof data}, 배열: ${Array.isArray(data)}`, 'info');

                // 응답 구조 확인 및 배열 추출
                // API 응답 형식: {result: true, message: "...", data: {total: X, restaurants: [...]}}
                if (data.data && data.data.restaurants && Array.isArray(data.data.restaurants)) {
                    logToScreen(`✅ data.restaurants 배열 형식, 개수: ${data.data.restaurants.length}`, 'success');
                    logToScreen(`📊 전체 개수: ${data.data.total}개`, 'info');
                    return data.data.restaurants;
                } else if (Array.isArray(data)) {
                    logToScreen(`✅ 직접 배열 형식, 개수: ${data.length}`, 'success');
                    return data;
                } else if (data.data && Array.isArray(data.data)) {
                    logToScreen(`✅ data 배열 형식, 개수: ${data.data.length}`, 'success');
                    return data.data;
                } else if (data.results && Array.isArray(data.results)) {
                    logToScreen(`✅ results 배열 형식, 개수: ${data.results.length}`, 'success');
                    return data.results;
                } else if (data.restaurants && Array.isArray(data.restaurants)) {
                    logToScreen(`✅ restaurants 배열 형식, 개수: ${data.restaurants.length}`, 'success');
                    return data.restaurants;
                } else {
                    logToScreen('⚠️ 예상치 못한 응답 형식', 'warning');
                    logToScreen(`응답 내용: ${JSON.stringify(data).substring(0, 300)}...`, 'info');
                    return [];
                }
            } catch (error) {
                logToScreen('❌ [에러] 레스토랑 목록 가져오기 실패', 'error');
                logToScreen(`❌ 에러 타입: ${error.name}`, 'error');
                logToScreen(`❌ 에러 메시지: ${error.message}`, 'error');

                // CORS 에러 감지
                if (error.message.includes('Failed to fetch') ||
                    error.message.includes('NetworkError') ||
                    error.name === 'TypeError' && error.message.includes('fetch')) {
                    logToScreen('🚫 [CORS 에러] 서버가 요청을 차단했습니다!', 'error');
                    logToScreen('🚫 서버에서 다음 헤더 설정 필요:', 'error');
                    logToScreen('   - Access-Control-Allow-Origin: *', 'error');
                    logToScreen('   - Access-Control-Allow-Methods: GET', 'error');
                    throw new Error('CORS 오류: 서버가 요청을 차단했습니다. 서버에서 CORS 설정이 필요합니다.');
                }

                throw error;
            }
        }

        async function fetchRestaurantDetails(restaurantId) {
            try {
                const url = `${API_BASE_URL}/api/restaurants/${restaurantId}`;
                logToScreen(`🌐 [요청] 레스토랑 상세 정보 가져오기 (ID: ${restaurantId})`, 'info');

                const response = await fetch(url);

                logToScreen(`📡 [응답] 상태: ${response.status} ${response.statusText}`, 'info');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: 레스토랑 상세 정보를 불러오는데 실패했습니다`);
                }

                const data = await response.json();
                logToScreen('✅ [성공] 레스토랑 상세 정보 수신', 'success');

                return data;
            } catch (error) {
                logToScreen('❌ [에러] 레스토랑 상세 정보 가져오기 실패', 'error');
                logToScreen(`❌ 에러 메시지: ${error.message}`, 'error');

                // CORS 에러 감지
                if (error.message.includes('Failed to fetch') ||
                    error.message.includes('NetworkError') ||
                    error.name === 'TypeError' && error.message.includes('fetch')) {
                    logToScreen('🚫 [CORS 에러] 발생', 'error');
                    throw new Error('CORS 오류: 서버가 요청을 차단했습니다. 서버에서 CORS 설정이 필요합니다.');
                }

                throw error;
            }
        }

        async function loadRestaurants() {
            try {
                isLoading = true;
                showRestaurantLoading();

                logToScreen('─'.repeat(50), 'info');
                logToScreen(`📂 전체 레스토랑 목록 로드 시작`, 'info');

                // 레스토랑 리스트 가져오기
                const restaurants = await fetchRestaurants();

                if (!restaurants || !Array.isArray(restaurants) || restaurants.length === 0) {
                    throw new Error('레스토랑 목록이 없습니다');
                }

                logToScreen(`✅ ${restaurants.length}개 레스토랑 로드 완료`, 'success');
                currentRestaurants = restaurants;
                displayRestaurants(restaurants);

            } catch (error) {
                logToScreen(`❌ 레스토랑 로드 실패: ${error.message}`, 'error');
                showRestaurantError(error.message || error.toString());
            } finally {
                isLoading = false;
            }
        }

        function displayRestaurants(restaurants) {
            const select = document.getElementById('restaurantSelect');

            // 기본 옵션만 남기고 초기화
            select.innerHTML = '<option value="">레스토랑을 선택하세요...</option>';
            select.disabled = false;

            if (!Array.isArray(restaurants)) {
                logToScreen('❌ restaurants가 배열이 아닙니다', 'error');
                return;
            }

            if (restaurants.length === 0) {
                logToScreen('❌ 레스토랑이 없습니다', 'error');
                return;
            }

            logToScreen(`🏪 ${restaurants.length}개 레스토랑 selectbox 추가`, 'info');
            restaurants.forEach((restaurant, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = restaurant.name || restaurant.place_name || `레스토랑 ${index + 1}`;
                select.appendChild(option);
            });
        }

        async function selectRestaurant() {
            const select = document.getElementById('restaurantSelect');
            const selectedIndex = select.value;

            if (!selectedIndex || selectedIndex === '') {
                return;
            }

            if (isSpinning || isLoading) return;

            const restaurant = currentRestaurants[parseInt(selectedIndex)];
            selectedRestaurant = restaurant;
            const restaurantName = restaurant.name || restaurant.place_name || '알 수 없음';

            logToScreen('─'.repeat(50), 'info');
            logToScreen(`🏪 레스토랑 선택: ${restaurantName}`, 'success');

            // 선택한 레스토랑의 메뉴 로드
            await loadMenuData(restaurant.id);
        }

        async function loadMenuData(restaurantId) {
            try {
                isLoading = true;
                showLoading();

                // 레스토랑 상세 정보 가져오기
                const detail = await fetchRestaurantDetails(restaurantId);

                if (!detail.result || !detail.data || !detail.data.menus || detail.data.menus.length === 0) {
                    throw new Error('해당 레스토랑의 메뉴 정보가 없습니다');
                }

                const menus = detail.data.menus;
                logToScreen(`🍽️ ${menus.length}개 메뉴 발견`, 'success');

                // 메뉴 데이터 구성
                const menuItems = menus.map(menu => ({
                    name: menu.name,
                    price: menu.price,
                    restaurant: detail.data.restaurant.name
                }));

                // 색상 할당
                const colors = [];
                for (let i = 0; i < menuItems.length; i++) {
                    colors.push(colorPalette[i % colorPalette.length]);
                }

                currentMenuData = {
                    items: menuItems,
                    colors: colors
                };

                logToScreen('✅ 룰렛 생성 완료!', 'success');
                hideLoading();
                drawRoulette();

            } catch (error) {
                logToScreen(`❌ 메뉴 로드 실패: ${error.message}`, 'error');
                showError(error.message);
            } finally {
                isLoading = false;
            }
        }

        function useFallbackData(category) {
            const fallbackData = {
                korean: ['김치찌개', '된장찌개', '불고기', '비빔밥', '삼겹살', '갈비탕', '냉면', '순두부찌개'],
                chinese: ['짜장면', '짬뽕', '탕수육', '마파두부', '양장피', '깐풍기', '볶음밥', '군만두'],
                western: ['스테이크', '파스타', '피자', '리조또', '햄버거', '샐러드', '그라탕', '오므라이스']
            };

            const items = fallbackData[category].map(name => ({ name, price: '', restaurant: '' }));
            currentMenuData = {
                items: items,
                colors: colorPalettes[category]
            };

            hideLoading();
            drawRoulette();
        }

        function showRestaurantLoading() {
            const select = document.getElementById('restaurantSelect');
            select.innerHTML = '<option value="">로딩 중...</option>';
            select.disabled = true;
        }

        function showRestaurantError(message) {
            const select = document.getElementById('restaurantSelect');
            const errorMsg = message.includes('CORS')
                ? '⚠️ CORS 에러 - 로그 확인'
                : `⚠️ ${message}`;
            select.innerHTML = `<option value="">${errorMsg}</option>`;
            select.disabled = true;
        }

        function showLoading() {
            document.getElementById('result').innerHTML = '<p style="color: #718096;"><span class="loading"></span>메뉴 데이터를 불러오는 중...</p>';
            document.getElementById('spinBtn').disabled = true;
        }

        function hideLoading() {
            document.getElementById('result').innerHTML = '<p style="color: #718096;">레스토랑을 선택하고 룰렛을 돌려보세요!</p>';
            document.getElementById('spinBtn').disabled = false;
        }

        function showError(message) {
            const isCorsError = message.includes('CORS');
            const errorHtml = isCorsError
                ? `<p class="error-text">🚫 ${message}<br><small>개발자 도구(F12) Console에서 자세한 정보 확인</small></p>`
                : `<p class="error-text">⚠️ ${message}</p>`;

            document.getElementById('result').innerHTML = errorHtml;
        }

        function drawRoulette() {
            if (!currentMenuData.items || currentMenuData.items.length === 0) {
                return;
            }

            const items = currentMenuData.items;
            const colors = currentMenuData.colors;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;
            const sliceAngle = (Math.PI * 2) / items.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 각 섹션 그리기
            items.forEach((item, index) => {
                const startAngle = sliceAngle * index + currentRotation;
                const endAngle = startAngle + sliceAngle;

                // 섹션 배경
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.lineTo(centerX, centerY);
                ctx.fillStyle = colors[index];
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 텍스트
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 4;
                const menuName = typeof item === 'string' ? item : item.name;
                ctx.fillText(menuName, radius - 20, 5);
                ctx.restore();
            });

            // 중앙 원
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function spinRoulette() {
            if (isSpinning || !currentMenuData.items || currentMenuData.items.length === 0) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('result').innerHTML = '<p style="color: #718096;">룰렛이 돌아가는 중...</p>';

            const items = currentMenuData.items;
            const spinDuration = 3000; // 3초
            const spinRotations = 5 + Math.random() * 3; // 5-8바퀴
            const totalRotation = spinRotations * Math.PI * 2;

            const startTime = Date.now();
            const startRotation = currentRotation;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);

                // easeOut 효과
                const easeProgress = 1 - Math.pow(1 - progress, 3);

                currentRotation = startRotation + totalRotation * easeProgress;
                drawRoulette();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // 결과 계산
                    const normalizedRotation = currentRotation % (Math.PI * 2);
                    const sliceAngle = (Math.PI * 2) / items.length;

                    // 화살표가 가리키는 위치 (위쪽 중앙)
                    const arrowAngle = (Math.PI * 2 - normalizedRotation + Math.PI / 2) % (Math.PI * 2);
                    const selectedIndex = Math.floor(arrowAngle / sliceAngle);
                    const selectedItem = items[selectedIndex];

                    // 결과 표시
                    setTimeout(() => {
                        const menuName = typeof selectedItem === 'string' ? selectedItem : selectedItem.name;
                        const restaurant = typeof selectedItem === 'object' && selectedItem.restaurant
                            ? `<br><small style="font-size: 0.6em; color: #718096;">${selectedItem.restaurant}</small>`
                            : '';
                        const price = typeof selectedItem === 'object' && selectedItem.price
                            ? `<br><small style="font-size: 0.5em; color: #4a5568;">${selectedItem.price}</small>`
                            : '';

                        document.getElementById('result').innerHTML =
                            `<div class="result-text">🎉 ${menuName} 🎉${restaurant}${price}</div>`;
                        isSpinning = false;
                        document.getElementById('spinBtn').disabled = false;
                    }, 500);
                }
            }

            animate();
        }

        // 초기 데이터 로드
        window.addEventListener('DOMContentLoaded', () => {
            logToScreen('═'.repeat(50), 'info');
            logToScreen('🎰 음식 메뉴 룰렛 시작', 'success');
            logToScreen('═'.repeat(50), 'info');
            logToScreen(`📍 API 서버: ${API_BASE_URL}`, 'info');
            logToScreen('🔍 모든 API 요청/응답이 여기 표시됩니다', 'info');
            logToScreen('═'.repeat(50), 'info');

            loadRestaurants();
        });
    </script>
</body>
