<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음식 메뉴 룰렛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #2d3748;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            color: #2d3748;
            animation: fadeInDown 1s ease-in-out;
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #4a5568;
        }

        .category-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .category-btn {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .category-btn:hover {
            background: #edf2f7;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .category-btn.active {
            background: #4299e1;
            color: white;
            border-color: #4299e1;
            box-shadow: 0 2px 12px rgba(66, 153, 225, 0.3);
        }

        .roulette-container {
            position: relative;
            display: inline-block;
            margin: 30px 0;
        }

        .roulette-wheel {
            position: relative;
        }

        #rouletteCanvas {
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            background: white;
        }

        .roulette-arrow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #e53e3e;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
            z-index: 10;
        }

        .spin-button {
            background: #48bb78;
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(72, 187, 120, 0.3);
            margin-top: 20px;
        }

        .spin-button:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-container {
            margin-top: 30px;
            padding: 25px;
            background: #f7fafc;
            border-radius: 15px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            border: 1px solid #e2e8f0;
        }

        .result-text {
            font-size: 2em;
            font-weight: bold;
            color: #2d3748;
            animation: bounceIn 0.6s ease-out;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            opacity: 0.08;
            font-size: 3em;
            animation: float 15s infinite ease-in-out;
        }

        .shape:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            left: 50%;
            animation-delay: 4s;
        }

        .shape:nth-child(4) {
            left: 70%;
            animation-delay: 6s;
        }

        .shape:nth-child(5) {
            left: 85%;
            animation-delay: 8s;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.08;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #718096;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            .container {
                padding: 20px;
            }
            #rouletteCanvas {
                width: 280px !important;
                height: 280px !important;
            }
            .result-text {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape">🍚</div>
        <div class="shape">🍜</div>
        <div class="shape">🍝</div>
        <div class="shape">🍕</div>
        <div class="shape">🍱</div>
    </div>

    <div class="container">
        <h1>🎰 음식 메뉴 룰렛</h1>
        <p class="subtitle">카테고리를 선택하고 룰렛을 돌려보세요!</p>

        <div class="category-buttons">
            <button class="category-btn active" onclick="selectCategory('korean')">🍚 한식</button>
            <button class="category-btn" onclick="selectCategory('chinese')">🍜 중식</button>
            <button class="category-btn" onclick="selectCategory('western')">🍝 양식</button>
        </div>

        <div class="roulette-container">
            <div class="roulette-arrow"></div>
            <div class="roulette-wheel">
                <canvas id="rouletteCanvas" width="400" height="400"></canvas>
            </div>
        </div>

        <button class="spin-button" onclick="spinRoulette()" id="spinBtn">🎯 룰렛 돌리기</button>

        <div class="result-container">
            <div id="result">
                <p style="color: #718096;">룰렛을 돌려서 오늘의 메뉴를 선택해보세요!</p>
            </div>
        </div>

        <div class="footer">
            <p>맛있는 식사 되세요! 🍽️</p>
        </div>
    </div>

    <script>
        const menuData = {
            korean: {
                name: '한식',
                items: ['김치찌개', '된장찌개', '불고기', '비빔밥', '삼겹살', '갈비탕', '냉면', '순두부찌개'],
                colors: ['#e53e3e', '#dd6b20', '#d69e2e', '#38a169', '#319795', '#3182ce', '#5a67d8', '#805ad5']
            },
            chinese: {
                name: '중식',
                items: ['짜장면', '짬뽕', '탕수육', '마파두부', '양장피', '깐풍기', '볶음밥', '군만두'],
                colors: ['#c53030', '#2c5282', '#2f855a', '#6b46c1', '#00718a', '#c05621', '#276749', '#4a5568']
            },
            western: {
                name: '양식',
                items: ['스테이크', '파스타', '피자', '리조또', '햄버거', '샐러드', '그라탕', '오므라이스'],
                colors: ['#742a2a', '#1a365d', '#22543d', '#553c9a', '#744210', '#2d3748', '#2c7a7b', '#975a16']
            }
        };

        let currentCategory = 'korean';
        let isSpinning = false;
        let currentRotation = 0;

        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');

        function selectCategory(category) {
            if (isSpinning) return;

            currentCategory = category;

            // 버튼 active 상태 변경
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 룰렛 다시 그리기
            drawRoulette();

            // 결과 초기화
            document.getElementById('result').innerHTML = '<p style="color: #718096;">룰렛을 돌려서 오늘의 메뉴를 선택해보세요!</p>';
        }

        function drawRoulette() {
            const items = menuData[currentCategory].items;
            const colors = menuData[currentCategory].colors;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;
            const sliceAngle = (Math.PI * 2) / items.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 각 섹션 그리기
            items.forEach((item, index) => {
                const startAngle = sliceAngle * index + currentRotation;
                const endAngle = startAngle + sliceAngle;

                // 섹션 배경
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.lineTo(centerX, centerY);
                ctx.fillStyle = colors[index];
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 텍스트
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 4;
                ctx.fillText(item, radius - 20, 5);
                ctx.restore();
            });

            // 중앙 원
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function spinRoulette() {
            if (isSpinning) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('result').innerHTML = '<p style="color: #718096;">룰렛이 돌아가는 중...</p>';

            const items = menuData[currentCategory].items;
            const spinDuration = 3000; // 3초
            const spinRotations = 5 + Math.random() * 3; // 5-8바퀴
            const totalRotation = spinRotations * Math.PI * 2;

            const startTime = Date.now();
            const startRotation = currentRotation;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);

                // easeOut 효과
                const easeProgress = 1 - Math.pow(1 - progress, 3);

                currentRotation = startRotation + totalRotation * easeProgress;
                drawRoulette();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // 결과 계산
                    const normalizedRotation = currentRotation % (Math.PI * 2);
                    const sliceAngle = (Math.PI * 2) / items.length;

                    // 화살표가 가리키는 위치 (위쪽 중앙)
                    const arrowAngle = (Math.PI * 2 - normalizedRotation + Math.PI / 2) % (Math.PI * 2);
                    const selectedIndex = Math.floor(arrowAngle / sliceAngle);
                    const selectedItem = items[selectedIndex];

                    // 결과 표시
                    setTimeout(() => {
                        document.getElementById('result').innerHTML = `<div class="result-text">🎉 ${selectedItem} 🎉</div>`;
                        isSpinning = false;
                        document.getElementById('spinBtn').disabled = false;
                    }, 500);
                }
            }

            animate();
        }

        // 초기 룰렛 그리기
        drawRoulette();
    </script>
</body>
</html>
